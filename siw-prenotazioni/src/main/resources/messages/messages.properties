# Messaggi di validazione in italiano.
# Spring cerca la chiave dalla più specifica alla più generica:
#   Annotazione.oggetto.campo  ->  Annotazione.campo  ->  Annotazione
# (oggetto = nome nel model: user, credentials, servizio, prenotazione)

# --- Messaggi generici ---
NotBlank=Campo obbligatorio
NotNull=Campo obbligatorio
typeMismatch=Valore non valido

# --- Registrazione ---
NotBlank.user.nome=Inserisci il nome
NotBlank.user.cognome=Inserisci il cognome
# l'apostrofo va scritto doppio ('') perché Spring tratta ' come carattere speciale
NotBlank.user.email=Inserisci l''email
NotBlank.credentials.username=Inserisci uno username
Size.credentials.username=Lo username deve avere tra 3 e 20 caratteri
NotBlank.credentials.password=Inserisci una password

# --- Materie (admin) ---
NotBlank.servizio.nome=Inserisci il nome della materia
Size.servizio.descrizione=La descrizione può avere al massimo 3000 caratteri
NotNull.servizio.durata=Inserisci la durata della lezione
Min.servizio.durata=La durata deve essere di almeno 1 minuto
typeMismatch.servizio.durata=La durata deve essere un numero intero di minuti
NotNull.servizio.prezzo=Inserisci il prezzo
PositiveOrZero.servizio.prezzo=Il prezzo non può essere negativo
typeMismatch.servizio.prezzo=Il prezzo deve essere un numero

# --- Prenotazioni ---
NotNull.prenotazione.data=Scegli una data
FutureOrPresent.prenotazione.data=La data non può essere nel passato
typeMismatch.prenotazione.data=Data non valida
NotNull.prenotazione.ora=Scegli un orario
typeMismatch.prenotazione.ora=Orario non valido
