<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title th:text="${titolo} ?: 'Prenotazioni'">Prenotazioni</title>
</head>
<body>
	<header>
		<h1 th:text="${titolo} ?: 'Prenotazioni'">Prenotazioni</h1>
    </header>
	<main>
		<div th:if="${param.error}">Username o password errati</div>

        <div th:if="${param.registrato}">Registrazione completata con successo. Fai il login per accedere</div>

        <form th:action="@{/login}" method="post">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>

            <button type="submit">Accedi</button>
        </form>
	</main>
</body>
</html>
