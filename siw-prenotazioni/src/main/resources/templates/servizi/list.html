<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Materie</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <header th:replace="~{fragments/base :: header}"></header>
    <main>
        <h2>Materie</h2>
        <p th:if="${servizi.isEmpty()}">Nessuna materia disponibile</p>
        <ul>
            <li th:each="servizio : ${servizi}">
                <a th:href="@{'/servizi/' + ${servizio.id}}" th:text="${servizio.nome}">Materia</a>
                <span th:text="' - ' + ${servizio.insegnante.nome} + ' ' + ${servizio.insegnante.cognome}">- Mario Rossi</span>
            </li>
        </ul>
    </main>
</body>

</html>
