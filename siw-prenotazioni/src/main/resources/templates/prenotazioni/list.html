<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prenotazioni</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <header th:replace="~{fragments/base :: header}"></header>
    <main>
        <h2>Le mie prenotazioni</h2>
        <p class="messaggio" th:if="${messaggio}" th:text="${messaggio}"></p>
        <p class="errore" th:if="${errore}" th:text="${errore}"></p>

        <p th:if="${prenotazioni.isEmpty()}">Nessuna prenotazione fatta</p>
        <a th:href="@{/servizi}">Prenota una lezione</a>

        <table th:if="${!prenotazioni.isEmpty()}">
            <thead>
                <tr>
                    <th>Materia</th>
                    <th>Data</th>
                    <th>Ora</th>
                    <th>Insegnante</th>
                    <th>Azioni</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="p : ${prenotazioni}">
                    <td th:text="${p.servizio.nome}">Nome materia</td>
                    <td th:text="${p.data}">Data</td>
                    <td th:text="${p.ora}">Ora</td>
                    <td th:text="${p.servizio.insegnante.nome}+ ' ' + ${p.servizio.insegnante.cognome}">Insegnante</td>
                    <td>
                        <form th:action="@{'/prenotazioni/' + ${p.id} + '/delete'}" method="post" onsubmit="return confirm('Annullare questa prenotazione?')">
                            <button type="submit">Annulla</button>
                        </form>
                        <a th:href="@{'/prenotazioni/' + ${p.id} + '/edit'}">Modifica</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </main>
</body>

</html>
