<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titolo} ?: 'Prenotazione ' + ${servizio.nome} ">Prenotazione</title>
</head>

<body>
    <header>
        <h1><a th:text="${titolo} ?: 'Prenotazioni'" th:href="@{/}">Prenotazioni</a></h1>
        <a th:href="@{/servizi}">Tutte le materie</a>
    </header>
    <main>
        <h2><a th:text="${servizio.nome}" th:href="@{'/servizi/'+ ${servizio.id}}">Materia</a></h2>
        <form th:action="@{'/prenotazioni/new/' + ${servizio.id}}" method="post" th:object="${prenotazione}">
            <label for="data">Data prenotazione</label>
            <input type="date" th:field="*{data}" id="data" required></input>
            <span th:if="${#fields.hasErrors('data')}" th:errors="*{data}"></span>

            <label for="time">Ora prenotazione</label>
            <input type="time" th:field="*{ora}" id="time" required></input>
            <span th:if="${#fields.hasErrors('ora')}" th:errors="*{ora}"></span>

            <p>Orari: lun-sab 9:00-19:00</p>

            <button type="submit">Prenota</button>
            <a th:href="@{'/servizi/' + ${servizio.id}}">Annulla</a>
        </form>
    </main>
</body>

</html>
