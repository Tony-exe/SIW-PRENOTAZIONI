<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titolo} ?: 'Prenotazione ' + ${servizio.nome} ">Prenotazione</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <header th:replace="~{fragments/base :: header}"></header>
    <main>
        <h2><a th:text="${servizio.nome}" th:href="@{'/servizi/'+ ${servizio.id}}">Materia</a></h2>
        <form th:action="${prenotazione.id == null} ? @{'/prenotazioni/new/' + ${servizio.id}} : @{'/prenotazioni/' + ${prenotazione.id} + '/edit'}" method="post" th:object="${prenotazione}">
            <label for="data">Data prenotazione</label>
            <input type="date" th:field="*{data}" id="data" required>
            <span th:if="${#fields.hasErrors('data')}" th:errors="*{data}"></span>

            <label for="ora">Orario</label>
            <select th:field="*{ora}" id="ora" required>
                <option value="">Scegli un orario</option>
                <option th:each="o : ${orari}" th:value="${o}"
                    th:text="${o} + ' - ' + ${o.plusMinutes(servizio.durata)}">10:00 - 11:00</option>
            </select>
            <span th:if="${#fields.hasErrors('ora')}" th:errors="*{ora}"></span>

            <p>Lezioni dal lunedì al sabato.</p>

            <button type="submit">Prenota</button>
            <a th:href="@{'/servizi/' + ${servizio.id}}">Annulla</a>
        </form>
    </main>
</body>

</html>
